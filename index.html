<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4ead6" />
    <meta name="description" content="风起小笺，给范范的一份生日祝福。" />
    <title>风起小笺</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app" id="app" aria-label="生日祝福 H5">
      <audio id="bgm" loop preload="none" src="./assets/bgm.mp3"></audio>
      <div class="petal-layer" id="petalLayer" aria-hidden="true"></div>

      <section class="screen" id="screen-1" data-screen="screen-1" aria-label="启封"></section>
      <section class="screen" id="screen-2" data-screen="screen-2" aria-label="江南与回忆"></section>
      <section class="screen" id="screen-3" data-screen="screen-3" aria-label="烟火"></section>
      <section class="screen" id="screen-4" data-screen="screen-4" aria-label="愿望签"></section>
      <section class="screen" id="screen-5" data-screen="screen-5" aria-label="收信"></section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="wish-modal" id="wishModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="wish-modal-card">
        <h2 id="modalTitle">永远 18 岁的范范</h2>
        <p>开心快乐</p>
        <button class="home-button" id="homeButton" type="button">返回首页</button>
      </div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
